services:

  db:
    image: bitnami/mariadb:11.8.3
    ports:
      - "3306:3306"
    restart: unless-stopped
    env_file:
      - ./conduit-backend/.env
    volumes:
      - db_data:/bitnami/mariadb 

  backend:
    build:
      context: ./conduit-backend
    image: conduit-backend:v1
    container_name: backend
    ports:
      - "2222:8383"
    restart: unless-stopped
    env_file:
      - ./conduit-backend/.env
    depends_on:
      - db
    volumes:
      - local_data_back:/app/media

  frontend:
    build:
      context: ./conduit-frontend
    image: conduit-frontend:v1
    container_name: frontend
    ports:
      - "8282:80"
    restart: unless-stopped
    env_file:
      - ./conduit-frontend/.env
    depends_on:
      - backend

volumes:
  db_data:
  local_data_back:
